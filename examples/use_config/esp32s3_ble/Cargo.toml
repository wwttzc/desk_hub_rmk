[package]
name = "rmk-esp32s3"
version = "0.2.0"
authors = ["Haobo Gu <haobogu@outlook.com>"]
description = "Keyboard firmware written in Rust"
homepage = "https://github.com/rmk-rs/rmk"
repository = "https://github.com/rmk-rs/rmk"
readme = "../../README.md"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
rmk = { path = "../../../rmk", default-features = false, features = [
    "esp32s3_ble",
    "log",
    "storage",
    "vial",
    "rgb",
    "smart_leds"
] }
embassy-executor = { version = "0.10" }
esp-backtrace = { version = "0.20", features = [
    "esp32s3",
    "panic-handler",
    "println",
] }
esp-hal = { version = "1.2.2", features = ["esp32s3", "unstable"] }
esp-storage = { version = "0.10", features = ["embedded-storage", "esp32s3"] }
esp-alloc = { version = "0.11" }
esp-println = { version = "0.18", features = ["esp32s3", "log-04"] }
esp-radio = { version = "1.0.0-beta.1", features = ["esp32s3", "unstable", "ble"] }
esp-rtos = { version = "0.4", features = ["esp32s3", "esp-radio", "embassy"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32s3", "log-04"] }
bt-hci = { version = "0.10" }
# The RMT-based WS2812 driver. Its chip feature is deliberately not enabled:
# `esp-hal-smartled` only needs the *peripheral* API, and the chip selection
# arrives through the `esp-hal` features above, which Cargo unifies across the
# graph. Enabling its `esp32s3` feature would additionally reference crates it
# only has as dev-dependencies.
esp-hal-smartled = { version = "0.18", default-features = false }

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"
embuild = "0.33"
cc = "1.2.9"

[[bin]]
name = "rmk-esp32s3"
test = false
bench = false

[profile.dev.package.esp-storage]
opt-level = 3

[profile.dev]
# Rust debug is too slow.
# For debug builds always builds with some optimization
opt-level = "s"

[profile.release]
codegen-units = 1        # LLVM can perform better optimizations using a single thread
debug = 2
debug-assertions = false
incremental = false
lto = 'thin'
opt-level = 3
overflow-checks = false
